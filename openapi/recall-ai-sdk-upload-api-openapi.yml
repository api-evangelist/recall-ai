openapi: 3.2.0
info:
  title: Recall.ai SDK Upload API
  version: 0.0.0
  description: Recall.ai API Documentation
servers:
- url: https://us-east-1.recall.ai
  description: Recall.ai API
- url: https://eu-central-1.recall.ai
  description: European Recall.ai API
- url: https://ap-northeast-1.recall.ai
  description: Asia Recall.ai API
- url: https://us-west-2.recall.ai
  description: Pay-as-you-go Recall.ai API
tags:
- name: sdk_upload
paths:
  /api/v1/sdk_upload/:
    get:
      operationId: sdk_upload_list
      description: 'Get a list of all Desktop SDK uploads


        The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
      summary: List Desktop SDK Uploads
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - sdk_upload
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDesktopSdkUploadList'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
    post:
      operationId: sdk_upload_create
      description: 'Create a new Desktop SDK upload.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Create Desktop SDK Upload
      tags:
      - sdk_upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesktopSdkUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DesktopSdkUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DesktopSdkUploadRequest'
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopSdkUpload'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
  /api/v1/sdk_upload/{id}/:
    get:
      operationId: sdk_upload_retrieve
      description: 'Get a Desktop SDK upload instance.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Retrieve Desktop SDK Upload
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - sdk_upload
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopSdkUpload'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
components:
  schemas:
    BotRecordingConfigRealtimeEndpointBotRecordingConfigRealtimeEndpointRtmpRequest:
      allOf:
      - $ref: '#/components/schemas/BotRecordingConfigRealtimeEndpointShared'
      - $ref: '#/components/schemas/BotRecordingConfigRealtimeEndpointRtmpRequest'
    BotRecordingConfigRealtimeEndpointBotRecordingConfigRealtimeEndpointWebsocketRequest:
      allOf:
      - $ref: '#/components/schemas/BotRecordingConfigRealtimeEndpointShared'
      - $ref: '#/components/schemas/BotRecordingConfigRealtimeEndpointWebsocketRequest'
    BotRecordingConfigRetentionRequest:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigRetentionSharedTypeEnum'
          description: 'The type of the retention policy.


            * `timed` - Timed

            * `forever` - Forever'
        hours:
          type: integer
          minimum: 1
          default: 168
          description: The number of hours to retain the recording.
      required:
      - type
    BotRecordingConfigRealtimeEndpointBotRecordingConfigRealtimeEndpointDesktopSdkCallbackRequest:
      allOf:
      - $ref: '#/components/schemas/BotRecordingConfigRealtimeEndpointShared'
      - $ref: '#/components/schemas/BotRecordingConfigRealtimeEndpointDesktopSdkCallbackRequest'
    DesktopSdkRecordingConfigRequest:
      type: object
      properties:
        video_mixed_mp4:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifactRequest'
          default: {}
          description: 'Capture mixed video of the meeting as part of the recording. **This is enabled by default**.


            Default: `{}`


            '
        audio_mixed_mp3:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifactRequest'
          description: 'Capture mixed audio of the meeting in mp3 format as an independent artifact.


            Default: `null`


            '
        audio_separate_raw:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifactRequest'
          description: 'Specify this to capture separate audio in raw format for each participant when using Desktop SDK raw media. **[Read more in this guide](https://docs.recall.ai/docs/how-to-get-separate-audio-per-participant-async)**


            Default: `null`


            '
        participant_events:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifactRequest'
          default: {}
          description: 'Capture participant events as part of the recording. **This is enabled by default**.


            Default: `{}`


            '
        video_mixed_participant_video_when_screenshare:
          allOf:
          - $ref: '#/components/schemas/VideoMixedParticipantVideoWhenScreenshareEnum'
          default: overlap
          description: 'The layout of participant video streams in mixed video output when screen is being shared. More docs: https://docs.recall.ai/docs/video-layouts


            * `hide` - hide

            * `beside` - beside

            * `overlap` - overlap'
        transcript:
          allOf:
          - $ref: '#/components/schemas/DesktopSdkTranscriptArtifactRequest'
          description: 'Specify this to capture transcript of the meeting as part of the recording. **[Read more in this guide](https://docs.recall.ai/docs/bot-real-time-transcription)**


            Default: `null`


            '
        realtime_endpoints:
          type: array
          items:
            $ref: '#/components/schemas/BotRecordingConfigRealtimeEndpointRequest'
          default: []
          description: 'Add endpoints here to receive data (e.g transcript, participant events) from the recording in realtime during the meeting.


            Default: `[]`


            '
        retention:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigRetentionRequest'
          description: Specify the retention policy for the recording. The DSDK does not currently support Zero Data Retention. **[Read more in this guide](https://docs.recall.ai/docs/storage-and-playback)**
        metadata:
          type: object
          additionalProperties:
            type: string
    DesktopSdkUpload:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/NewDesktopSdkUploadStatus'
          readOnly: true
        recording_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        upload_token:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
      - created_at
      - id
      - recording_id
      - status
      - upload_token
    BotRecordingConfigRealtimeEndpointWebsocketRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          description: The URL of the realtime endpoint.
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
            - participant_events.join
            - participant_events.leave
            - participant_events.update
            - participant_events.speech_on
            - participant_events.speech_off
            - participant_events.webcam_on
            - participant_events.webcam_off
            - participant_events.microphone_on
            - participant_events.microphone_off
            - participant_events.screenshare_on
            - participant_events.screenshare_off
            - participant_events.chat_message
            - audio_mixed_raw.data
            - transcript.data
            - transcript.partial_data
            - transcript.provider_data
            - audio_separate_raw.data
            - video_separate_png.data
            - video_separate_h264.data
          description: The events to send to the realtime endpoint.
      required:
      - events
      - url
    PaginatedDesktopSdkUploadList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/DesktopSdkUpload'
    BotRecordingConfigRealtimeEndpointSharedTypeEnum:
      enum:
      - rtmp
      - websocket
      - webhook
      - desktop_sdk_callback
      type: string
      description: '* `rtmp` - Rtmp

        * `websocket` - Websocket

        * `webhook` - Webhook

        * `desktop_sdk_callback` - Desktop Sdk Callback'
    NewDesktopSdkUploadStatus:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/NewDesktopSdkUploadStatusCodeEnum'
        sub_code:
          type:
          - string
          - 'null'
        updated_at:
          type: string
          format: date-time
      required:
      - code
      - sub_code
      - updated_at
    BotRecordingConfigBaseArtifactRequest:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
    DesktopSdkTranscriptProviderRequest:
      type: object
      properties:
        recallai_streaming:
          type: object
          title: RecallAI Real-time Transcription Settings
          description: ' **[Read more in this guide](https://docs.recall.ai/docs/recallai-transcription)**'
        assembly_ai_v3_streaming:
          type: object
          properties:
            speech_model:
              description: The speech model used for your Streaming session.
              enum:
              - universal-streaming-english
              - universal-streaming-multilingual
              - whisper-rt
              - u3-rt-pro
              - universal-3-5-pro
            format_turns:
              description: Whether to return formatted final transcripts.
              default: false
              type: boolean
            inactivity_timeout:
              description: Optional time in seconds of inactivity before session is terminated. If not set, no inactivity timeout is applied.
              default: None
              format: s
              type: integer
              minimum: 5
              maximum: 3600
            keyterms_prompt:
              description: A list of words and phrases to improve recognition accuracy for. See [Keyterms Prompting](https://www.assemblyai.com/docs/streaming/keyterms-prompting) for more details.
              type: array
              items:
                x-label: Word
                type: string
            language_detection:
              description: Whether to detect the language and return language metadata on utterances and final turns. Only available for the multilingual model.
              enum:
              - 'true'
              - 'false'
              - true
              - false
              default: 'false'
            max_turn_silence:
              description: The maximum amount of silence in milliseconds allowed in a turn before end of turn is triggered. See [Turn Detection](https://www.assemblyai.com/docs/streaming/universal-streaming/turn-detection) for configuration details.
              type: integer
              default: 1280
            min_turn_silence:
              description: The minimum amount of silence in milliseconds required to detect end of turn when confident. See [Turn Detection](https://www.assemblyai.com/docs/streaming/universal-streaming/turn-detection) for configuration details.
              type: integer
              default: 400
            vad_threshold:
              description: The confidence threshold (0.0 to 1.0) for classifying audio frames as silence. Frames with VAD confidence below this value are considered silent. Increase for noisy environments to reduce false speech detection.
              default: 0.4
              type: number
            end_of_turn_confidence_threshold:
              description: The confidence threshold (0.0 to 1.0) to use when determining if the end of a turn has been reached. See [Turn Detection](https://www.assemblyai.com/docs/streaming/universal-streaming/turn-detection) for configuration details.
              deprecated: true
              type: number
              default: 0.4
            language:
              description: The language of your audio stream.
              enum:
              - en
              - multi
              default: en
              deprecated: true
          title: AssemblyAi Real-time Transcription Settings
          description: 'Docs: https://www.assemblyai.com/docs/api-reference/streaming-api/streaming-api'
        deepgram_streaming:
          type: object
          properties:
            diarize:
              description: Defaults to `false`. Recognize speaker changes. Each word in the transcript will be assigned a speaker number starting at 0
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            dictation:
              description: Identify and extract key entities from content in submitted audio
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            endpointing:
              description: Indicates how long Deepgram will wait to detect whether a speaker has finished speaking or pauses for a significant period of time. When set to a value, the streaming endpoint immediately finalizes the transcription for the processed time range and returns the transcript with a speech_final parameter set to true. Can also be set to false to disable endpointing
              default: '10'
            extra:
              description: Arbitrary key-value pairs that are attached to the API response for usage in downstream processing
            filler_words:
              description: Filler Words can help transcribe interruptions in your audio, like "uh" and "um"
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            interim_results:
              description: Specifies whether the streaming endpoint should provide ongoing transcription updates as more audio is received. When set to true, the endpoint sends continuous updates, meaning transcription results may evolve over time
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            keyterm:
              description: Key term prompting can boost or suppress specialized terminology and brands. Only compatible with Nova-3
            keywords:
              description: Keywords can boost or suppress specialized terminology and brands
            language:
              description: The [BCP-47 language tag](https://tools.ietf.org/html/bcp47) that hints at the primary spoken language. Depending on the Model you choose only certain languages are available
              default: en
              enum:
              - bg
              - ca
              - cs
              - da
              - da-DK
              - de
              - de-CH
              - el
              - en
              - en-AU
              - en-GB
              - en-IN
              - en-NZ
              - en-US
              - es
              - es-419
              - es-LATAM
              - et
              - fi
              - fr
              - fr-CA
              - hi
              - hi-Latn
              - hu
              - id
              - it
              - ja
              - ko
              - ko-KR
              - lt
              - lv
              - ms
              - multi
              - nl
              - nl-BE
              - 'no'
              - pl
              - pt
              - pt-BR
              - pt-PT
              - ro
              - ru
              - sk
              - sv
              - sv-SE
              - taq
              - th
              - th-TH
              - tr
              - uk
              - vi
              - zh
              - zh-CN
              - zh-HK
              - zh-Hans
              - zh-Hant
              - zh-TW
            mip_opt_out:
              description: Opts out requests from the Deepgram Model Improvement Program. Refer to our Docs for pricing impacts before setting this to true. https://dpgr.am/deepgram-mip
              default: 'false'
            model:
              description: AI model to use for the transcription
              enum:
              - nova-3
              - nova-3-general
              - nova-3-medical
              - nova-2
              - nova-2-general
              - nova-2-meeting
              - nova-2-finance
              - nova-2-conversationalai
              - nova-2-voicemail
              - nova-2-video
              - nova-2-medical
              - nova-2-drivethru
              - nova-2-automotive
              - nova
              - nova-general
              - nova-phonecall
              - nova-medical
              - enhanced
              - enhanced-general
              - enhanced-meeting
              - enhanced-phonecall
              - enhanced-finance
              - base
              - meeting
              - phonecall
              - finance
              - conversationalai
              - voicemail
              - video
              - custom
            multichannel:
              description: Transcribe each audio channel independently
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            numerals:
              description: Convert numbers from written format to numerical format
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            profanity_filter:
              description: Profanity Filter looks for recognized profanity and converts it to the nearest recognized non-profane word or removes it from the transcript completely
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            punctuate:
              description: Add punctuation and capitalization to the transcript
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            redact:
              description: Redaction removes sensitive information from your transcripts
              default: 'false'
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
            replace:
              description: Search for terms or phrases in submitted audio and replaces them
            search:
              description: Search for terms or phrases in submitted audio
            smart_format:
              description: Apply formatting to transcript output. When set to true, additional formatting will be applied to transcripts to improve readability
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            tag:
              description: Label your requests for the purpose of identification during usage reporting
            utterance_end_ms:
              description: Indicates how long Deepgram will wait to send an UtteranceEnd message after a word has been transcribed. Use with interim_results
            vad_events:
              description: Indicates that speech has started. You'll begin receiving Speech Started messages upon speech starting
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            version:
              description: Version of an AI model to use
              default: latest
          title: Deepgram Real-time Transcription Settings
          description: 'Docs: https://developers.deepgram.com/reference/streaming'
        gladia_v2_streaming:
          type: object
          properties:
            custom_metadata:
              type: object
              description: Custom metadata you can attach to this live transcription
              example:
                user: John Doe
            model:
              type: string
              description: The model used to process the audio. "solaria-1" is used by default.
              default: solaria-1
              enum:
              - solaria-1
            endpointing:
              type: number
              description: The endpointing duration in seconds. Endpointing is the duration of silence which will cause an utterance to be considered as finished
              default: 0.05
              minimum: 0.01
              maximum: 10
            maximum_duration_without_endpointing:
              type: number
              description: The maximum duration in seconds without endpointing. If endpointing is not detected after this duration, current utterance will be considered as finished
              default: 5
              minimum: 5
              maximum: 60

tags:
- name: zoom-meetings-to-credentials
paths:
  /api/v2/zoom-meetings-to-credentials/:
    get:
      operationId: zoom_meetings_to_credentials_list
      description: 'Get a list of all mappings from Zoom Meeting ID to Zoom OAuth Credential. Recall uses mappings internally to determine which credential to use when automatically fetching join tokens for a meeting. Inspecting these mappings may be helpful when debugging bots that don''t automatically record due to being unable to fetch join tokens.


        The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
      summary: List Zoom Meeting to OAuth Credential Mappings
      parameters:
      - in: query
        name: credential
        schema:
          type: string
          format: uuid
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: meeting_id
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: synced_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: synced_at_before
        schema:
          type: string
          format: date-time
      tags:
      - zoom-meetings-to-credentials
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZoomMeetingToCredentialList'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
components:
  schemas:
    ZoomMeetingToCredential:
      type: object
      properties:
        meeting_id:
          type: integer
          maximum: 9223372036854776000
          minimum: -9223372036854776000
          format: int64
        credential:
          type: string
          format: uuid
        synced_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - credential
      - meeting_id
      - synced_at
    PaginatedZoomMeetingToCredentialList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ZoomMeetingToCredential'
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
    CalendarJwtAuthentication:
      type: apiKey
      in: header
      name: x-recallcalendarauthtoken

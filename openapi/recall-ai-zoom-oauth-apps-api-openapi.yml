openapi: 3.2.0
info:
  title: Recall.ai Zoom OAUTH Apps API
  version: 0.0.0
  description: Recall.ai API Documentation
servers:
- url: https://us-east-1.recall.ai
  description: Recall.ai API
- url: https://eu-central-1.recall.ai
  description: European Recall.ai API
- url: https://ap-northeast-1.recall.ai
  description: Asia Recall.ai API
- url: https://us-west-2.recall.ai
  description: Pay-as-you-go Recall.ai API
tags:
- name: zoom-oauth-apps
paths:
  /api/v2/zoom-oauth-app-logs/:
    get:
      operationId: zoom_oauth_app_logs_list
      description: 'Get a list of all Zoom OAuth App Logs. Any warnings or errors related to the OAuth App will be logged here, and this can be helpful for debugging.


        The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
      summary: List Zoom OAuth App Logs
      parameters:
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date-time
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: oauth_app
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - zoom-oauth-apps
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZoomOAuthAppLogList'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
  /api/v2/zoom-oauth-apps/:
    get:
      operationId: zoom_oauth_apps_list
      description: 'Get a list of all Zoom OAuth Apps.


        The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
      summary: List Zoom OAuth Apps
      parameters:
      - in: query
        name: client_id
        schema:
          type: string
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date-time
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: webhook_last_validation_after
        schema:
          type: string
          format: date-time
      - in: query
        name: webhook_last_validation_before
        schema:
          type: string
          format: date-time
      tags:
      - zoom-oauth-apps
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZoomOAuthAppList'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
    post:
      operationId: zoom_oauth_apps_create
      description: 'Create a new Zoom OAuth App.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Create Zoom OAuth App
      tags:
      - zoom-oauth-apps
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoomOAuthAppRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ZoomOAuthAppRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ZoomOAuthAppRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoomOAuthApp'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
  /api/v2/zoom-oauth-apps/{id}/:
    get:
      operationId: zoom_oauth_apps_retrieve
      description: 'Get a Zoom OAuth App.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Retrieve Zoom OAuth App
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this zoom o auth app.
        required: true
      tags:
      - zoom-oauth-apps
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoomOAuthApp'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
    patch:
      operationId: zoom_oauth_apps_partial_update
      description: 'Update an existing Zoom OAuth App


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Update Zoom OAuth App
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this zoom o auth app.
        required: true
      tags:
      - zoom-oauth-apps
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedZoomOAuthAppPartialUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedZoomOAuthAppPartialUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedZoomOAuthAppPartialUpdateRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoomOAuthApp'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
    delete:
      operationId: zoom_oauth_apps_destroy
      description: 'Deletes a Zoom OAuth App.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Destroy Zoom OAuth App
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this zoom o auth app.
        required: true
      tags:
      - zoom-oauth-apps
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
components:
  schemas:
    ZoomOAuthApp:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/ZoomOAuthAppKindEnum'
        client_id:
          type: string
          maxLength: 200
        client_secret:
          type: string
          maxLength: 200
        webhook_secret:
          type: string
          maxLength: 200
        webhook_last_validation:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client_id
      - client_secret
      - created_at
      - id
      - kind
      - webhook_last_validation
      - webhook_secret
    ZoomOAuthAppRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ZoomOAuthAppKindEnum'
        client_id:
          type: string
          minLength: 1
          maxLength: 200
        client_secret:
          type: string
          minLength: 1
          maxLength: 200
        webhook_secret:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - client_id
      - client_secret
      - kind
      - webhook_secret
    PaginatedZoomOAuthAppList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ZoomOAuthApp'
    ZoomOAuthAppKindEnum:
      enum:
      - user_level
      - account_level
      type: string
      description: '* `user_level` - User Level

        * `account_level` - Account Level'
    PatchedZoomOAuthAppPartialUpdateRequest:
      type: object
      properties:
        webhook_secret:
          type: string
          minLength: 1
        client_secret:
          type: string
          minLength: 1
    ZoomOAuthAppLog:
      type: object
      properties:
        oauth_app:
          type: string
          format: uuid
        message:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - message
      - oauth_app
    PaginatedZoomOAuthAppLogList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ZoomOAuthAppLog'
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
    CalendarJwtAuthentication:
      type: apiKey
      in: header
      name: x-recallcalendarauthtoken

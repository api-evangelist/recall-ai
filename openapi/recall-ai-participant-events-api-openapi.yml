openapi: 3.2.0
info:
  title: Recall.ai Participant Events API
  version: 0.0.0
  description: Recall.ai API Documentation
servers:
- url: https://us-east-1.recall.ai
  description: Recall.ai API
- url: https://eu-central-1.recall.ai
  description: European Recall.ai API
- url: https://ap-northeast-1.recall.ai
  description: Asia Recall.ai API
- url: https://us-west-2.recall.ai
  description: Pay-as-you-go Recall.ai API
tags:
- name: participant_events
paths:
  /api/v1/participant_events/:
    get:
      operationId: participant_events_list
      summary: List Participant Events
      parameters:
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date-time
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: recording_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status_code
        schema:
          type: string
          enum:
          - done
          - failed
          - processing
        description: '* `processing` - Processing

          * `done` - Done

          * `failed` - Failed'
      tags:
      - participant_events
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParticipantEventsArtifactList'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
      description: 'The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
  /api/v1/participant_events/{id}/:
    get:
      operationId: participant_events_retrieve
      summary: Retrieve Participant Events
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this participant events artifact.
        required: true
      tags:
      - participant_events
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantEventsArtifact'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
    patch:
      operationId: participant_events_partial_update
      summary: Update Participant Events
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this participant events artifact.
        required: true
      tags:
      - participant_events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedParticipantEventsArtifactRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedParticipantEventsArtifactRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedParticipantEventsArtifactRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantEventsArtifact'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
    delete:
      operationId: participant_events_destroy
      summary: Delete Participant Events
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this participant events artifact.
        required: true
      tags:
      - participant_events
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
components:
  schemas:
    RecordingMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
      required:
      - id
      - metadata
    ParticipantEventsArtifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        recording:
          allOf:
          - $ref: '#/components/schemas/RecordingMinimal'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ArtifactStatus'
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            type: string
        data:
          allOf:
          - $ref: '#/components/schemas/ParticipantEventsArtifactData'
          readOnly: true
      required:
      - created_at
      - data
      - id
      - metadata
      - recording
      - status
    PatchedParticipantEventsArtifactRequest:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
    ArtifactStatus:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ArtifactStatusCodeEnum'
        sub_code:
          type:
          - string
          - 'null'
        updated_at:
          type: string
          format: date-time
      required:
      - code
      - sub_code
      - updated_at
    PaginatedParticipantEventsArtifactList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantEventsArtifact'
    ParticipantEventsArtifactData:
      type: object
      properties:
        participant_events_download_url:
          type:
          - string
          - 'null'
          format: uri
          readOnly: true
          description: Download all participant events for the recording. **[See response format here](https://docs.recall.ai/docs/download-schemas#json-participant-event-download-url)**
        speaker_timeline_download_url:
          type:
          - string
          - 'null'
          format: uri
          readOnly: true
          description: Download speaker timeline for the recording. **[See response format here](https://docs.recall.ai/docs/download-schemas#json-speaker-timeline-download-url)**
        participants_download_url:
          type:
          - string
          - 'null'
          format: uri
          readOnly: true
          description: Download all participants for the recording. **[See response format here](https://docs.recall.ai/docs/download-schemas#json-participant-download-url)**
      required:
      - participant_events_download_url
      - participants_download_url
      - speaker_timeline_download_url
    ArtifactStatusCodeEnum:
      enum:
      - processing
      - done
      - failed
      - deleted
      type: string
      description: '* `processing` - Processing

        * `done` - Done

        * `failed` - Failed

        * `deleted` - Deleted'
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
    CalendarJwtAuthentication:
      type: apiKey
      in: header
      name: x-recallcalendarauthtoken

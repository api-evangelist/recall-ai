openapi: 3.2.0
info:
  title: Recall.ai Audio Separate API
  version: 0.0.0
  description: Recall.ai API Documentation
servers:
- url: https://us-east-1.recall.ai
  description: Recall.ai API
- url: https://eu-central-1.recall.ai
  description: European Recall.ai API
- url: https://ap-northeast-1.recall.ai
  description: Asia Recall.ai API
- url: https://us-west-2.recall.ai
  description: Pay-as-you-go Recall.ai API
tags:
- name: audio_separate
paths:
  /api/v1/audio_separate/:
    get:
      operationId: audio_separate_list
      summary: List Audio Separate
      parameters:
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date-time
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: recording_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status_code
        schema:
          type: string
          enum:
          - done
          - failed
          - processing
        description: '* `processing` - Processing

          * `done` - Done

          * `failed` - Failed'
      tags:
      - audio_separate
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudioSeparateArtifactList'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
      description: 'The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
  /api/v1/audio_separate/{id}/:
    get:
      operationId: audio_separate_retrieve
      summary: Retrieve Audio Separate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio separate artifact.
        required: true
      tags:
      - audio_separate
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioSeparateArtifact'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
    patch:
      operationId: audio_separate_partial_update
      summary: Update Audio Separate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio separate artifact.
        required: true
      tags:
      - audio_separate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAudioSeparateArtifactRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAudioSeparateArtifactRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAudioSeparateArtifactRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioSeparateArtifact'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
    delete:
      operationId: audio_separate_destroy
      summary: Delete Audio Separate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio separate artifact.
        required: true
      tags:
      - audio_separate
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
components:
  schemas:
    RecordingMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
      required:
      - id
      - metadata
    AudioSeparateArtifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        recording:
          allOf:
          - $ref: '#/components/schemas/RecordingMinimal'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ArtifactStatus'
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            type: string
        data:
          allOf:
          - $ref: '#/components/schemas/AudioSeparateArtifactData'
          readOnly: true
        format:
          allOf:
          - $ref: '#/components/schemas/AudioSeparateArtifactFormatEnum'
          readOnly: true
          description: 'Format of the participant separated audio files


            * `raw` - Raw

            * `ogg` - Ogg'
      required:
      - created_at
      - data
      - format
      - id
      - metadata
      - recording
      - status
    AudioSeparateArtifactData:
      type: object
      properties:
        download_url:
          type:
          - string
          - 'null'
          format: uri
          readOnly: true
          description: Download all audio separate parts for the recording. **[See response format here](https://docs.recall.ai/docs/download-schemas#json-audio-separate-download-url)**
      required:
      - download_url
    PatchedAudioSeparateArtifactRequest:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
    PaginatedAudioSeparateArtifactList:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AudioSeparateArtifact'
    ArtifactStatus:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ArtifactStatusCodeEnum'
        sub_code:
          type:
          - string
          - 'null'
        updated_at:
          type: string
          format: date-time
      required:
      - code
      - sub_code
      - updated_at
    AudioSeparateArtifactFormatEnum:
      enum:
      - raw
      - ogg
      type: string
      description: '* `raw` - Raw

        * `ogg` - Ogg'
    ArtifactStatusCodeEnum:
      enum:
      - processing
      - done
      - failed
      - deleted
      type: string
      description: '* `processing` - Processing

        * `done` - Done

        * `failed` - Failed

        * `deleted` - Deleted'
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
    CalendarJwtAuthentication:
      type: apiKey
      in: header
      name: x-recallcalendarauthtoken

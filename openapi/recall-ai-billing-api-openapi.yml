  description: Pay-as-you-go Recall.ai API
tags:
- name: Billing
paths:
  /api/v1/billing/usage/:
    get:
      operationId: billing_usage_retrieve
      description: 'Get bot usage statistics


        The base rate limit for this endpoint is:

        - 5 requests per min per workspace'
      summary: Get Usage
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
      - in: query
        name: start
        schema:
          type: string
          format: date-time
      tags:
      - Billing
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 5
        period: min
components:
  schemas:
    UsageResponse:
      type: object
      description: Serializer for usage statistics response.
      properties:
        bot_total:
          type: number
          format: double
          description: The total amount of time, in seconds, of bots used.
      required:
      - bot_total
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
    CalendarJwtAuthentication:
      type: apiKey
      in: header
      name: x-recallcalendarauthtoken

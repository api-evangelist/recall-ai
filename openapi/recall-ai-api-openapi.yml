        speechmatics_async:
          description: 'JSON object that contains various groups of job configuration

            parameters. Based on the value of `type`, a type-specific object

            such as `transcription_config` is required to be present to

            specify all configuration settings or parameters needed to

            process the job inputs as expected.


            If the results of the job are to be forwarded on completion,

            `notification_config` can be provided with a list of callbacks

            to be made; no assumptions should be made about the order in

            which they will occur.


            Customer specific job details or metadata can be supplied in

            `tracking`, and this information will be available where

            possible in the job results and in callbacks.

            '
          properties:
            alignment_config:
              required:
              - language
              properties:
                language:
                  type: string
              example:
                language: en
            transcription_config:
              required:
              - language
              properties:
                language:
                  type: string
                  description: Language model to process the audio input, normally specified as an ISO language code
                domain:
                  type: string
                  description: Request a specialized model based on 'language' but optimized for a particular field, e.g. "finance" or "medical".
                output_locale:
                  type: string
                  description: Language locale to be used when generating the transcription output, normally specified as an ISO language code
                model:
                  type: string
                  description: Specific model to use in transcription (previously called operating point).
                  enum:
                  - standard
                  - enhanced
                  - melia-1
                operating_point:
                  type: string
                  enum:
                  - standard
                  - enhanced
                  - melia-1
                additional_vocab:
                  type: array
                  x-omitempty: true
                  items:
                    type: object
                    required:
                    - content
                    properties:
                      content:
                        type: string
                      sounds_like:
                        type: array
                        x-omitempty: true
                        items:
                          type: string
                  description: List of custom words or phrases that should be recognized. Alternative pronunciations can be specified to aid recognition.
                punctuation_overrides:
                  properties:
                    sensitivity:
                      type: number
                      format: float
                      minimum: 0
                      maximum: 1
                      description: Ranges between zero and one. Higher values will produce more punctuation. The default is 0.5.
                    permitted_marks:
                      type: array
                      items:
                        type: string
                        pattern: ^(.|all)$
                      description: The punctuation marks which the client is prepared to accept in transcription output, or the special value 'all' (the default). Unsupported marks are ignored. This value is used to guide the transcription process.
                  description: Control punctuation settings.
                diarization:
                  type: string
                  enum:
                  - none
                  - speaker
                  - channel
                  description: "Specify whether speaker or channel labels are added to the transcript.\nThe default is `none`.\n  - **none**: no speaker or channel labels are added.\n  - **speaker**: speaker attribution is performed based on acoustic matching;\n             all input channels are mixed into a single stream for processing.\n  - **channel**: multiple input channels are processed individually and collated\n            into a single transcript."
                channel_diarization_labels:
                  type: array
                  x-omitempty: true
                  items:
                    type: string
                    pattern: ^[A-Za-z0-9._]+$
                  description: Transcript labels to use when using collating separate input channels.
                enable_entities:
                  type: boolean
                  description: Include additional 'entity' objects in the transcription results (e.g. dates, numbers) and their original spoken form. These entities are interleaved with other types of results. The concatenation of these words is represented as a single entity with the concatenated written form present in the 'content' field. The entities contain a 'spoken_form' field, which can be used in place of the corresponding 'word' type results, in case a spoken form is preferred to a written form. They also contain a 'written_form', which can be used instead of the entity, if you want a breakdown of the words without spaces. They can still contain non-breaking spaces and other special whitespace characters, as they are considered part of the word for the formatting output. In case of a written_form, the individual word times are estimated and might not be accurate if the order of the words in the written form does not correspond to the order they were actually spoken (such as 'one
                    hundred million dollars' and '$100 million').
                max_delay_mode:
                  type: string
                  enum:
                  - fixed
                  - flexible
                  description: Whether or not to enable flexible endpointing and allow the entity to continue to be spoken.
                transcript_filtering_config:
                  description: Configuration for applying filtering to the transcription
                  properties:
                    remove_disfluencies:
                      type: boolean
                      description: If true, words that are identified as disfluencies will be removed from the transcript. If false (default), they are tagged in the transcript as 'disfluency'.
                    replacements:
                      type: array
                      x-omitempty: true
                      items:
                        additionalProperties: false
                        type: object
                        required:
                        - from
                        - to
                        properties:
                          from:
                            type: string
                          to:
                            type: string
                      description: A list of replacements to apply to the transcript. Each replacement is a pair of strings, where the first string is the pattern to be replaced and the second string is the replacement text.
                speaker_diarization_config:
                  description: Configuration for speaker diarization
                  properties:
                    prefer_current_speaker:
                      type: boolean
                      description: If true, the algorithm will prefer to stay with the current active speaker if it is a close enough match, even if other speakers may be closer.  This is useful for cases where we can flip incorrectly between similar speakers during a single speaker section."
                    speaker_sensitivity:
                      type: number
                      format: float
                      minimum: 0
                      maximum: 1
                      description: Controls how sensitive the algorithm is in terms of keeping similar speakers separate, as opposed to combining them into a single speaker.  Higher values will typically lead to more speakers, as the degree of difference between speakers in order to allow them to remain distinct will be lower.  A lower value for this parameter will conversely guide the algorithm towards being less sensitive in terms of retaining similar speakers, and as such may lead to fewer speakers overall.  The default is 0.5.
              example:
                language: en

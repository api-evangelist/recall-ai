              - it
              - ja
              - ko
              - ko-KR
              - lt
              - lv
              - ms
              - multi
              - nl
              - nl-BE
              - 'no'
              - pl
              - pt
              - pt-BR
              - pt-PT
              - ro
              - ru
              - sk
              - sv
              - sv-SE
              - taq
              - th

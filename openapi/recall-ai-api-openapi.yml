        schema:
          type: string
      - in: query
        name: recording_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status_code
        schema:
          type: string
          enum:
          - done
          - failed
          - processing
        description: '* `processing` - Processing

          * `done` - Done


        calendar_meetings:
          type: array
          items:
            $ref: '#/components/schemas/BotCalendarMeeting'
          readOnly: true
          description: The calendar meetings associated with this bot. This field is **populated only for bots that are dispatched via Calendar V1 API integration**.
        zoom:
          allOf:
          - $ref: '#/components/schemas/Zoom'
          nullable: true
          description: Zoom specific parameters
        google_meet:
          allOf:
          - $ref: '#/components/schemas/GoogleMeet'
          nullable: true
          description: Google Meet specific parameters
        slack_team:
          allOf:
          - $ref: '#/components/schemas/SlackTeamIntegrationMinimal'
          readOnly: true
          nullable: true
        webex:
          allOf:
          - $ref: '#/components/schemas/Webex'
          nullable: true
          description: Webex specific parameters
        breakout_room:
          allOf:
          - $ref: '#/components/schemas/_BreakoutRoomSchema'
          nullable: true
          description: 'Configure how the bot handles breakout rooms. Currently, Zoom is supported.Examples: {"mode": "join_main_room"} | {"mode": "join_specific_room", "room_id": "<uuid>"} | {"mode": "auto_accept_all_invites"} (default).'
        metadata:
          type: object
          additionalProperties:
            type: string
      required:

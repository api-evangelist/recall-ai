          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
      description: 'The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
  /api/v1/audio_separate/{id}/:
    get:
      operationId: audio_separate_retrieve
      summary: Retrieve Audio Separate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio separate artifact.
        required: true
      tags:
      - audio_separate
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioSeparateArtifact'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
    patch:
      operationId: audio_separate_partial_update
      summary: Update Audio Separate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio separate artifact.
        required: true
      tags:
      - audio_separate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAudioSeparateArtifactRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAudioSeparateArtifactRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAudioSeparateArtifactRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioSeparateArtifact'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
    delete:
      operationId: audio_separate_destroy
      summary: Delete Audio Separate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio separate artifact.
        required: true
      tags:
      - audio_separate
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
  /api/v1/billing/usage/:
    get:
      operationId: billing_usage_retrieve
      description: 'Get bot usage statistics


        The base rate limit for this endpoint is:

        - 5 requests per min per workspace'
      summary: Get Usage
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
      - in: query
        name: start
        schema:
          type: string
          format: date-time
      tags:
      - billing
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 5
        period: min
  /api/v1/bot/:
    get:
      operationId: bot_list
      description: 'Get a list of all bots


        The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
      summary: List Bots
      parameters:
      - in: query
        name: join_at_after
        schema:
          type: string
          format: date
      - in: query
        name: join_at_before
        schema:
          type: string
          format: date
      - in: query
        name: meeting_url
        schema:
          type: string
      - in: query
        name: metadata__<key>
        schema:
          type: string
        description: Filter by metadata. Replace <key> with the metadata key you want to filter on.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: platform
        schema:
          type: array
          items:
            type: string
            enum:
            - chime_sdk
            - google_meet
            - google_meet_media_api
            - goto_meeting
            - microsoft_teams
            - microsoft_teams_live
            - slack_authenticator
            - slack_huddle_observer
            - webex
            - zoom
            - zoom_rtms
        description: '* `zoom` - Zoom

          * `google_meet` - Meet

          * `goto_meeting` - Goto

          * `microsoft_teams` - Teams

          * `microsoft_teams_live` - Teams Live

          * `webex` - Webex

          * `chime_sdk` - Chime Sdk

          * `zoom_rtms` - Zoom Rtms

          * `google_meet_media_api` - Google Meet Media Api

          * `slack_authenticator` - Slack Authenticator

          * `slack_huddle_observer` - Slack Huddle Observer'
        explode: true
        style: form
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - analysis_done
            - analysis_failed
            - call_ended
            - done
            - fatal
            - in_call_not_recording
            - in_call_recording
            - in_waiting_room
            - joining_call
            - media_expired
            - ready
            - recording_done
            - recording_permission_allowed
            - recording_permission_denied
        description: '* `ready` - Ready

          * `joining_call` - Joining Call

          * `in_waiting_room` - In Waiting Room

          * `in_call_not_recording` - In Call Not Recording

          * `recording_permission_allowed` - Recording Permission Allowed

          * `recording_permission_denied` - Recording Permission Denied

          * `in_call_recording` - In Call Recording

          * `recording_done` - Recording Done

          * `call_ended` - Call Ended

          * `done` - Done

          * `fatal` - Fatal

          * `media_expired` - Media Expired

          * `analysis_done` - Analysis Done

          * `analysis_failed` - Analysis Failed'
        explode: true
        style: form
      - in: query
        name: use_cursor
        schema:
          type: string
        description: When present, uses cursor-based pagination instead of offset pagination.
      tags:
      - bot
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBotGetList'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
    post:
      operationId: bot_create
      description: 'Create a new bot.


        The base rate limit for this endpoint is:

        - 120 requests per min per workspace'
      summary: Create Bot
      tags:
      - bot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BotRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
          description: ''
        '400':
          description: No response body
        '507':
          content:
            application/json:
              schema:
                description: If no bots are available in the ad-hoc bot pool the HTTP 507 code is returned. The ad-hoc bot pool is replenished every few minutes so retrying the request will eventually succeed.
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 120
        period: min
  /api/v1/bot/{id}/:
    get:
      operationId: bot_retrieve
      description: 'Get a bot instance.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Retrieve Bot
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bot.
        required: true
      tags:
      - bot
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotGet'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
    patch:
      operationId: bot_partial_update
      description: 'Update a Scheduled Bot.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Update Scheduled Bot
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bot.
        required: true
      tags:
      - bot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBotRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
    delete:
      operationId: bot_destroy
      description: 'Deletes a bot. This can only be done on scheduled bots that have not yet joined a call.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Delete Scheduled Bot
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bot.
        required: true
      tags:
      - bot
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
        '405':
          content:
            application/json:
              schema:
                description: The specified Bot cannot be deleted. Only scheduled bots which have not yet joined a call can be deleted.
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
  /api/v1/bot/{id}/delete_media/:
    post:
      operationId: bot_delete_media_create
      description: 'Deletes bot media stored by Recall. This is irreversible.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Delete Bot Media
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bot.
        required: true
      tags:
      - bot
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Cannot delete media for an in-progress bot.
          description: ''
        '409':
          content:
            application/json:
              schema:
                description: A request to delete media for this bot is already in progress.
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min

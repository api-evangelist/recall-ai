  /api/v1/bot/{id}/pause_recording/:
    post:
      operationId: bot_pause_recording_create
      description: 'Instructs the bot to pause the current recording.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Pause Recording
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this bot.
        required: true
      tags:
      - bot
      security:
      - tokenAuth: []
      responses:
        '200':
          content:

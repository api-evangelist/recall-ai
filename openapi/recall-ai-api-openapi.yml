openapi: 3.0.3
info:
  title: Recall.ai API
  version: 0.0.0
  description: Recall.ai API Documentation
servers:
- url: https://us-east-1.recall.ai
  description: Recall.ai API
- url: https://eu-central-1.recall.ai
  description: European Recall.ai API
- url: https://ap-northeast-1.recall.ai
  description: Asia Recall.ai API
- url: https://us-west-2.recall.ai
  description: Pay-as-you-go Recall.ai API
paths:
  /api/v1/audio_mixed/:
    get:
      operationId: audio_mixed_list
      summary: List Audio Mixed
      parameters:
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date-time
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: recording_id
        schema:
          type: string
          format: uuid
      - in: query
        name: status_code
        schema:
          type: string
          enum:
          - done
          - failed
          - processing
        description: '* `processing` - Processing

          * `done` - Done

          * `failed` - Failed'
      tags:
      - audio_mixed
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudioMixedArtifactList'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
      description: 'The base rate limit for this endpoint is:

        - 60 requests per min per workspace'
  /api/v1/audio_mixed/{id}/:
    get:
      operationId: audio_mixed_retrieve
      summary: Retrieve Audio Mixed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio mixed artifact.
        required: true
      tags:
      - audio_mixed
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioMixedArtifact'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
    patch:
      operationId: audio_mixed_partial_update
      summary: Update Audio Mixed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio mixed artifact.
        required: true
      tags:
      - audio_mixed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAudioMixedArtifactRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAudioMixedArtifactRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAudioMixedArtifactRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioMixedArtifact'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
    delete:
      operationId: audio_mixed_destroy
      summary: Delete Audio Mixed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audio mixed artifact.
        required: true
      tags:
      - audio_mixed
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      description: 'The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
  /api/v1/audio_separate/:
    get:
      operationId: audio_separate_list
      summary: List Audio Separate
      parameters:
      - in: query
        name: created_at_after
        schema:

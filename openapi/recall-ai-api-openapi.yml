    DesktopSdkTranscriptProviderRequest:
      type: object
      properties:
        recallai_streaming:
          type: object
          title: RecallAI Real-time Transcription Settings
          description: ' **[Read more in this guide](https://docs.recall.ai/docs/recallai-transcription)**'
        assembly_ai_v3_streaming:
          type: object
          properties:
            speech_model:
              description: The speech model used for your Streaming session.
              enum:
              - universal-streaming-english
              - universal-streaming-multilingual
              - whisper-rt
              - u3-rt-pro
              - universal-3-5-pro
            format_turns:
              description: Whether to return formatted final transcripts.
              default: false
              type: boolean
            inactivity_timeout:
              description: Optional time in seconds of inactivity before session is terminated. If not set, no inactivity timeout is applied.
              default: None
              format: s
              type: integer
              minimum: 5
              maximum: 3600
            keyterms_prompt:
              description: A list of words and phrases to improve recognition accuracy for. See [Keyterms Prompting](https://www.assemblyai.com/docs/streaming/keyterms-prompting) for more details.
              type: array
              items:
                x-label: Word
                type: string
            language_detection:
              description: Whether to detect the language and return language metadata on utterances and final turns. Only available for the multilingual model.
              enum:
              - 'true'
              - 'false'
              - true
              - false
              default: 'false'
            max_turn_silence:
              description: The maximum amount of silence in milliseconds allowed in a turn before end of turn is triggered. See [Turn Detection](https://www.assemblyai.com/docs/streaming/universal-streaming/turn-detection) for configuration details.
              type: integer
              default: 1280
            min_turn_silence:
              description: The minimum amount of silence in milliseconds required to detect end of turn when confident. See [Turn Detection](https://www.assemblyai.com/docs/streaming/universal-streaming/turn-detection) for configuration details.
              type: integer
              default: 400
            vad_threshold:
              description: The confidence threshold (0.0 to 1.0) for classifying audio frames as silence. Frames with VAD confidence below this value are considered silent. Increase for noisy environments to reduce false speech detection.
              default: 0.4
              type: number
            end_of_turn_confidence_threshold:
              description: The confidence threshold (0.0 to 1.0) to use when determining if the end of a turn has been reached. See [Turn Detection](https://www.assemblyai.com/docs/streaming/universal-streaming/turn-detection) for configuration details.
              deprecated: true
              type: number
              default: 0.4
            language:
              description: The language of your audio stream.
              enum:
              - en
              - multi
              default: en
              deprecated: true
          title: AssemblyAi Real-time Transcription Settings
          description: 'Docs: https://www.assemblyai.com/docs/api-reference/streaming-api/streaming-api'
        deepgram_streaming:
          type: object
          properties:
            diarize:
              description: Defaults to `false`. Recognize speaker changes. Each word in the transcript will be assigned a speaker number starting at 0
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            dictation:
              description: Identify and extract key entities from content in submitted audio
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            endpointing:
              description: Indicates how long Deepgram will wait to detect whether a speaker has finished speaking or pauses for a significant period of time. When set to a value, the streaming endpoint immediately finalizes the transcription for the processed time range and returns the transcript with a speech_final parameter set to true. Can also be set to false to disable endpointing
              default: '10'
            extra:
              description: Arbitrary key-value pairs that are attached to the API response for usage in downstream processing
            filler_words:
              description: Filler Words can help transcribe interruptions in your audio, like "uh" and "um"
              default: 'false'
              enum:
              - 'true'
              - 'false'
              - true
              - false
            interim_results:

          type: object
          properties:
            language:
              type: string
            domain:
              type: string
              description: Request a specialized model based on 'language' but optimized for a particular field, e.g. "finance" or "medical".
            output_locale:
              type: string
              minLength: 1
            additional_vocab:
              type: array
              items:
                type: object
                oneOf:
                - type: string
                  minLength: 1
                - type: object
                  properties:
                    content:
                      type: string
                      minLength: 1
                    sounds_like:
                      type: array
                      items:
                        type: string
                        minLength: 1
                      minItems: 1
                  required:
                  - content
            diarization:
              type: string
              enum:
              - none
              - speaker
            max_delay:
              type: number
              minimum: 0
            max_delay_mode:
              type: string
              enum:
              - flexible
              - fixed
            speaker_diarization_config:
              type: object
              properties:
                max_speakers:
                  type: number
                  format: integer
                  minimum: 2
                  maximum: 100
                prefer_current_speaker:
                  type: boolean
                speaker_sensitivity:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                get_speakers:
                  type: boolean
                speakers:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                        minLength: 1
                      speaker_identifiers:
                        type: array
                        items:
                          type: string
                          format: byte
                        minItems: 1
                    required:
                    - label
                    - speaker_identifiers
                  maxItems: 50
            audio_filtering_config:
              type: object
              properties:
                volume_threshold:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 100
            transcript_filtering_config:
              type: object
              properties:
                remove_disfluencies:
                  type: boolean
                replacements:
                  type: array
                  items:
                    type: object
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                    required:
                    - from
                    - to
            enable_partials:
              type: boolean
              default: false
            enable_entities:
              type: boolean
              default: true
            operating_point:
              type: string
              enum:
              - standard
              - enhanced
            punctuation_overrides:
              type: object
              properties:
                permitted_marks:
                  type: array
                  description: The punctuation marks which the client is prepared to accept in transcription output, or the special value 'all' (the default). Unsupported marks are ignored. This value is used to guide the transcription process.
                  items:
                    pattern: ^(.|all)$
                    type: string
                sensitivity:
                  type: number
                  description: Ranges between zero and one. Higher values will produce more punctuation. The default is 0.5.
                  format: float
                  maximum: 1
                  minimum: 0
            conversation_config:
              type: object
              properties:
                end_of_utterance_silence_trigger:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 2
                  default: 0
              description: This mode will detect when a speaker has stopped talking. The end_of_utterance_silence_trigger is the time in seconds after which the server will assume that the speaker has finished speaking, and will emit an EndOfUtterance message. A value of 0 disables the feature.
          required:
          - language
          title: Speechmatics Real-time Transcription Settings
          description: 'You must specify `language` (e.g `en`)


            Docs: https://docs.speechmatics.com/rt-api-ref#transcription-config'

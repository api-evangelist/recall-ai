      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioOutputDataRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudioOutputDataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioOutputDataRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':

          * `unhealthy` - Unhealthy'
      - in: query
        name: user_id
        schema:
          type: string
      tags:
      - zoom-oauth-credentials
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZoomOAuthCredentialList'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 60
        period: min
    post:
      operationId: zoom_oauth_credentials_create
      description: 'Create a new Zoom OAuth Credential.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Create Zoom OAuth Credential
      tags:
      - zoom-oauth-credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoomOAuthCredentialRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ZoomOAuthCredentialRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ZoomOAuthCredentialRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoomOAuthCredential'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoomOAuthCredentialBadRequest'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
  /api/v2/zoom-oauth-credentials/{id}/:
    get:
      operationId: zoom_oauth_credentials_retrieve
      description: 'Get a Zoom OAuth Credential.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Retrieve Zoom OAuth Credential
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this zoom o auth credential.
        required: true
      tags:
      - zoom-oauth-credentials
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoomOAuthCredential'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
    delete:
      operationId: zoom_oauth_credentials_destroy
      description: 'Deletes a Zoom OAuth Credential.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Destroy Zoom OAuth Credential
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this zoom o auth credential.
        required: true
      tags:
      - zoom-oauth-credentials
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
  /api/v2/zoom-oauth-credentials/{id}/access-token/:
    get:
      operationId: zoom_oauth_credentials_access_token_retrieve
      description: 'Get the access token for these credentials.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Get Access Token
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this zoom o auth credential.
        required: true
      tags:
      - zoom-oauth-credentials
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoomAccessToken'
          description: ''
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
  /api/v2/zoom-oauth-credentials/{id}/sync-meetings/:
    post:
      operationId: zoom_oauth_credentials_sync_meetings_create
      description: 'Manually re-sync meetings accessible from these credentials. This operation is asynchronous, and may take some time to complete.Use the `meeting_sync_status` field on the credential object to check status of sync.This is ONLY useful for debugging, and should not be called on a regular basis. Meetings are ordinarily automatically synced.


        The base rate limit for this endpoint is:

        - 300 requests per min per workspace'
      summary: Manually Resync Meetings
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this zoom o auth credential.
        required: true
      tags:
      - zoom-oauth-credentials
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
  /api/v2/zoom-oauth-credentials/{id}/validate/:
    post:
      operationId: zoom_oauth_credentials_validate_create
      description: "Manually check the validity of credentials, and re-enable them if they are functional. This can be useful if credentials are disabled due to repeated errors. \n\nThe base rate limit for this endpoint is:\n- 300 requests per min per workspace"
      summary: Manually Revalidate Credential
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this zoom o auth credential.
        required: true
      tags:
      - zoom-oauth-credentials
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
components:
  schemas:
    PaginatedZoomMeetingToCredentialList:
      type: object
      properties:
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ZoomMeetingToCredential'
    ZoomMeetingToCredential:
      type: object
      properties:
        meeting_id:
          type: integer
          maximum: 9223372036854776000
          minimum: -9223372036854776000
          format: int64
        credential:
          type: string
          format: uuid
        synced_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - credential
      - meeting_id
      - synced_at
    ArtifactStatus:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ArtifactStatusCodeEnum'
        sub_code:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
      required:
      - code
      - sub_code
      - updated_at
    ArtifactStatusCodeEnum:
      enum:
      - processing
      - done
      - failed
      - deleted
      type: string
      description: '* `processing` - Processing

        * `done` - Done

        * `failed` - Failed

        * `deleted` - Deleted'
    AudioMixedArtifactData:
      type: object
      properties:
        download_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
      required:
      - download_url
    AudioMixedArtifactShortcut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ArtifactStatus'
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            type: string
        data:
          allOf:
          - $ref: '#/components/schemas/AudioMixedArtifactData'
          readOnly: true
        format:
          allOf:
          - $ref: '#/components/schemas/Format33bEnum'
          readOnly: true
          description: 'Format of the mixed audio file


            * `mp3` - Mp3

            * `raw` - Raw'
      required:
      - created_at
      - data
      - format
      - id
      - metadata
      - status
    AudioOutput:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AudioOutputData'
        replay_on_participant_join:
          allOf:
          - $ref: '#/components/schemas/AudioOutputReplay'
          description: Specify this parameter if you want the audio to be replayed when additional participants join the call.
      required:
      - data
    AudioOutputData:
      type: object
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/AudioOutputDataKindEnum'
          description: 'The kind of data encoded in b64_data


            * `mp3` - mp3'
      required:
      - kind
    AudioOutputDataKindEnum:
      enum:
      - mp3
      type: string
      description: '* `mp3` - mp3'
    AudioOutputReplay:
      type: object
      properties:
        debounce_mode:
          allOf:
          - $ref: '#/components/schemas/DebounceModeEnum'
          default: trailing
          description: "Leading: The debounce timer will start counting down when the first participant joins.\nTrailing: The debounce timer will start counting down when the last participant joins.\nFor example with a debounce_interval of 10, if two participants join 9 seconds apart: \n - In `Leading` mode the audio will play 10 seconds after the 1st participant joined (1 second after the 2nd participant)\n - In `Trailing` mode the audio will play 10 seconds after the 2nd participant joined (19 seconds after the 1st participant)\n\n* `leading` - leading\n* `trailing` - trailing"
        debounce_interval:
          type: integer
          description: The amount of time to wait for additional participants to join before replaying the audio.
        disable_after:
          type: integer
          description: The number of seconds after which the audio will no longer replay when new participants join. This parameter is useful to prevent the bot from interrupting a meeting, if a late participant joins.
      required:
      - debounce_interval
    AutomaticAudioOutput:
      type: object
      properties:
        in_call_recording:
          $ref: '#/components/schemas/AudioOutput'
      required:
      - in_call_recording
    AutomaticLeave:
      type: object
      properties:
        waiting_room_timeout:
          type: integer
          minimum: 30
          default: 1200
          description: The number of seconds after which the bot will automatically leave the call, if it has not been let in from the waiting room. If you join Zoom using an OBF token, this timeout also caps how long the bot will wait for the associated user to join the meeting; if the user never joins before the timeout, the join fails with zoom_obf_user_not_in_meeting. Note that this has a max value of 600 seconds for Google Meet and 1800 for Microsoft Teams.
        noone_joined_timeout:
          type: integer
          minimum: 30
          default: 1200
          description: The number of seconds after which the bot will automatically leave the call, if it has joined the meeting but no other participant has joined.
        everyone_left_timeout:
          allOf:
          - $ref: '#/components/schemas/AutomaticLeaveEveryoneLeft'
          description: 'The number of seconds after which the bot will automatically leave the call, if there were other participants in the call who have all left. Note: The everyone_left waiter remains active and will trigger even if recording is paused, unlike other automatic leave waiters which are paused when recording is paused.'
        in_call_not_recording_timeout:
          type: integer
          minimum: 1
          default: 3600
          description: The number of seconds after which the bot will automatically leave the call, if it has joined the call and is not recording.This includes all periods when the bot is not recording, even if the bot has recorded previously.
        in_call_recording_timeout:
          type: integer
          minimum: 1
          description: The number of seconds after which the bot will automatically leave the call, if it has joined the call and started recording it. This can be used to enforce a maximum recording time limit for a bot. There is no default value for this parameter, meaning a bot will continue to record for as long as the meeting lasts.
        recording_permission_denied_timeout:
          type: integer
          minimum: 1
          default: 30
          description: The number of seconds after which the bot will automatically leave the call, if it has joined the call but has not started recording. For e.g This can occur due to bot being denied permission to record(Zoom meetings).
        silence_detection:
          allOf:
          - $ref: '#/components/schemas/AutomaticLeaveSilenceDetection'
          default:
            timeout: 3600
            activate_after: 1200
        bot_detection:
          allOf:
          - $ref: '#/components/schemas/AutomaticLeaveBotDetection'
          default:
            using_participant_events:
              timeout: 600
              activate_after: 1200
            using_participant_names:
              matches:
              - notetaker
              - recorder
              - assistant
              timeout: 600
              activate_after: 120
    AutomaticLeaveBotDetection:
      type: object
      properties:
        using_participant_events:
          $ref: '#/components/schemas/AutomaticLeaveBotDetectionUsingParticipantEvents'
        using_participant_names:
          $ref: '#/components/schemas/AutomaticLeaveBotDetectionUsingParticipantNames'
    AutomaticLeaveBotDetectionUsingParticipantEvents:
      type: object
      properties:
        timeout:
          type: integer
          minimum: 10
          default: 600
          description: The number of seconds after which the bot will automatically leave the call if all other participants(in call) are detected as bots using this heuristic. A participant is considered a bot if they have no audio or screenshare activity for the duration of the call.
        activate_after:
          type: integer
          minimum: 1
          default: 1200
          description: The number of seconds(post recording start) after which the bot will start detecting other participants as bots using this heuristic. This parameter can be helpful if the meeting tends to start late, so the bot does not preemptively leave.
    AutomaticLeaveBotDetectionUsingParticipantNames:
      type: object
      properties:
        timeout:
          type: integer
          minimum: 10
          description: The number of seconds after which the bot will automatically leave the call if all other participants(in call) are detected as bots using this heuristic. A participant is considered a bot if their name contains any of the strings specified in the `matches` parameter(case insensitive match).
        activate_after:
          type: integer
          minimum: 1
          description: The number of seconds(post recording start) after which the bot will start detecting other participants as bots using this heuristic. This parameter can be helpful if the meeting tends to start late, so the bot does not preemptively leave.
        matches:
          type: array
          items:
            type: string
          description: A list of strings that the bot will use to detect other bots. If a participant's name contains any of these strings(case insensitive match), they will be considered a bot. If all remaining participants in the call are detected as bots(except the bot itself), the bot will automatically leave the call.For e.g ['notetaker', 'recorder', 'assistant']
      required:
      - activate_after
      - matches
      - timeout
    AutomaticLeaveEveryoneLeft:
      type: object
      properties:
        timeout:
          type: integer
          minimum: 1
          default: 2
          description: The number of seconds after which the bot will automatically leave the call, if there were other participants in the call who have all left.
        activate_after:
          type: integer
          minimum: 1
          nullable: true
          description: 'The number of seconds after which the bot will start detecting everyone left once it has started recording the call. '
    AutomaticLeaveSilenceDetection:
      type: object
      properties:
        timeout:
          type: integer
          minimum: 10
          default: 3600
          description: The number of seconds of continuous silence after which the bot will automatically leave the call.
        activate_after:
          type: integer
          minimum: 1
          default: 1200
          description: The number of seconds after which the bot will start detecting silence once it has started recording the call. This parameter can be helpful if the meeting tends to start late, so the bot does not preemptively leave.
    AutomaticVideoOutput:
      type: object
      properties:
        in_call_recording:
          allOf:
          - $ref: '#/components/schemas/VideoOutput'
          description: The video that will be automatically output when the bot is in the **in_call_recording** state.
        in_call_not_recording:
          allOf:
          - $ref: '#/components/schemas/VideoOutput'
          description: The video that will be automatically output when the bot is in the **in_call_not_recording** state. If not specified the bot will fallback to in_call_recording output if available.
    BotCalendarMeeting:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
        calendar_user:
          allOf:
          - $ref: '#/components/schemas/BotCalendarUser'
          readOnly: true
      required:
      - calendar_user
      - end_time
      - id
      - start_time
    BotCalendarUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        external_id:
          type: string
          readOnly: true
      required:
      - external_id
      - id
    BotEvent:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        sub_code:
          type: string
          readOnly: true
      required:
      - code
      - created_at
      - message
      - sub_code
    BotGet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        meeting_url:
          allOf:
          - $ref: '#/components/schemas/MeetingInvite'
          description: The url of the meeting. For example, https://zoom.us/j/123?pwd=456. This field will be cleared a few days after the bot has joined a call.
        bot_name:
          type: string
          default: Meeting Notetaker
          description: 'The name of the bot that will be displayed in the call.

            *(Note: Authenticated Google Meet bots will use the Google account name and this field will be ignored.)*'
          maxLength: 100
        join_at:
          type: string
          format: date-time
          readOnly: true
          description: The time at which the bot is scheduled to join the call, formatted in ISO 8601. For ad-hoc bots, this is the time at which the bot was requested to join.
        recording_config:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfig'
          nullable: true
          description: Configure the recording generated by the bot. Includes options for getting meeting transcript,  the layout of the recorded video, when to start recording and more.
        status_changes:
          type: array
          items:
            $ref: '#/components/schemas/BotEvent'
          readOnly: true
        recordings:
          type: array
          items:
            $ref: '#/components/schemas/BotRecordingEmbed'
          readOnly: true
        output_media:
          allOf:
          - $ref: '#/components/schemas/OutputMedia'
          nullable: true
          description: Settings for the bot output media.
        automatic_video_output:
          allOf:
          - $ref: '#/components/schemas/AutomaticVideoOutput'
          nullable: true
          description: 'Settings for the bot to output video. Image should be 16:9. Read more about this here: https://docs.recall.ai/docs/output-video-in-meetings'
        automatic_audio_output:
          allOf:
          - $ref: '#/components/schemas/AutomaticAudioOutput'
          nullable: true
          description: Settings for the bot to output audio.
        chat:
          allOf:
          - $ref: '#/components/schemas/Chat'
          nullable: true
          description: "Settings for the bot to send chat messages. \n*(Note: Chat functionality is only supported for Zoom, Google Meet and Microsoft Teams currently.)*"
        automatic_leave:
          allOf:
          - $ref: '#/components/schemas/AutomaticLeave'
          nullable: true
        variant:
          allOf:
          - $ref: '#/components/schemas/BotVariant'
          nullable: true
          description: 'Configure bot variants per meeting platforms, e.g. {"zoom": "web_4_core"}.'
        calendar_meetings:
          type: array
          items:
            $ref: '#/components/schemas/BotCalendarMeeting'
          readOnly: true
          description: The calendar meetings associated with this bot. This field is **populated only for bots that are dispatched via Calendar V1 API integration**.
        zoom:
          allOf:
          - $ref: '#/components/schemas/Zoom'
          nullable: true
          description: Zoom specific parameters
        google_meet:
          allOf:
          - $ref: '#/components/schemas/GoogleMeet'
          nullable: true
          description: Google Meet specific parameters
        slack_team:
          allOf:
          - $ref: '#/components/schemas/SlackTeamIntegrationMinimal'
          readOnly: true
          nullable: true
        webex:
          allOf:
          - $ref: '#/components/schemas/Webex'
          nullable: true
          description: Webex specific parameters
        breakout_room:
          allOf:
          - $ref: '#/components/schemas/_BreakoutRoomSchema'
          nullable: true
          description: 'Configure how the bot handles breakout rooms. Currently, Zoom is supported.Examples: {"mode": "join_main_room"} | {"mode": "join_specific_room", "room_id": "<uuid>"} | {"mode": "auto_accept_all_invites"} (default).'
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
      - calendar_meetings
      - id
      - join_at
      - meeting_url
      - recordings
      - status_changes
    BotIncludeInRecording:
      type: object
      properties:
        audio:
          type: boolean
          default: false
          description: Whether to record audio from the bot.
    BotRecordingConfig:
      type: object
      properties:
        transcript:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigTranscriptArtifact'
          nullable: true
          description: "Specify this to capture transcript of the meeting as part of the recording. Supports:\n- [Recall.ai Transcription](https://docs.recall.ai/docs/recallai-transcription)\n- [3rd-party AI transcription providers](https://docs.recall.ai/docs/ai-transcription)\n- [meeting caption transcription](https://docs.recall.ai/docs/meeting-caption-transcription)\n\n **[Read more about real-time transcription.](https://docs.recall.ai/docs/bot-real-time-transcription)**\n\nDefault: `null`\n\n"
        realtime_endpoints:
          type: array
          items:
            $ref: '#/components/schemas/BotRecordingConfigRealtimeEndpoint'
          default: []
          description: 'Add endpoints here to receive data (e.g transcript, participant events) from the recording in realtime during the meeting.


            Default: `[]`


            '
        retention:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigRetention'
          nullable: true
          description: Specify the retention policy for the recording. **[Read more in this guide](https://docs.recall.ai/docs/storage-and-playback)**
        video_mixed_layout:
          allOf:
          - $ref: '#/components/schemas/VideoMixedLayoutEnum'
          default: speaker_view
          description: 'The layout of the mixed video output.


            * `speaker_view` - speaker_view

            * `gallery_view` - gallery_view

            * `gallery_view_v2` - gallery_view_v2

            * `audio_only` - audio_only'
        video_mixed_mp4:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifact'
          nullable: true
          description: 'Capture mixed video of the meeting as part of the recording. **This is enabled by default**.


            Default: `{}`


            '
        participant_events:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifact'
          nullable: true
          default: {}
          description: 'Capture participant events as part of the recording. **This is enabled by default**.


            Default: `{}`


            '
        meeting_metadata:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifact'
          nullable: true
          default: {}
          description: 'Capture meeting metadata as part of the recording. **This is enabled by default**.


            Default: `{}`


            '
        video_mixed_participant_video_when_screenshare:
          allOf:
          - $ref: '#/components/schemas/VideoMixedParticipantVideoWhenScreenshareEnum'
          default: overlap
          description: 'The layout of participant video streams in mixed video output when screen is being shared. More docs: https://docs.recall.ai/docs/video-layouts


            * `hide` - hide

            * `beside` - beside

            * `overlap` - overlap'
        start_recording_on:
          allOf:
          - $ref: '#/components/schemas/StartRecordingOnEnum'
          default: participant_join
          description: 'Specify when automatic recording should start.

            *call_join* - Bot will start recording as soon as it joins the call.

            *participant_join* - Bot will start recording when the first participant joins the call. If a participant is already present when the bot joins, the bot will automatically start recording.

            *participant_speak* - Bot will start recording when the first participant starts talking.



            * `call_join` - call_join

            * `participant_join` - participant_join

            * `participant_speak` - participant_speak'
        include_bot_in_recording:
          $ref: '#/components/schemas/BotIncludeInRecording'
        metadata:
          type: object
          additionalProperties:
            type: string
        audio_mixed_raw:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifact'
          nullable: true
          description: 'Specify this to capture mixed audio in raw format of the meeting.


            Default: `null`


            '
        audio_mixed_mp3:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifact'
          nullable: true
          description: 'Specify this to capture mixed audio in the mp3 format of the meeting


            Default: `null`


            '
        video_separate_mp4:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifact'
          nullable: true
          description: 'Specify this to capture separate video in mp4 format for each participant in the meeting. Only supported with video_mixed_layout=''gallery_view_v2''. **[Read more in this guide](https://docs.recall.ai/docs/how-to-get-separate-videos-per-participant-async)**


            Default: `null`


            '
        audio_separate_raw:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifact'
          nullable: true
          description: 'Specify this to capture separate audio in raw format for each participant in the meeting(**limited support**).  **[Read more in this guide](https://docs.recall.ai/docs/how-to-get-separate-audio-per-participant-async)**


            Default: `null`


            '
        audio_separate_mp3:
          allOf:
          - $ref: '#/components/schemas/BotRecordingConfigBaseArtifact'
          nullable: true

          format: uuid
        description: A UUID string identifying this bot.
        required: true
      tags:
      - bot
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      x-throttles:
      - scope_key: workspace_id
        limit: 300
        period: min
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                camera:
                  type: boolean
                  description: Stop outputting media on the bot camera
                  default: false
                screenshare:
                  type: boolean
                  description: Stop outputting media on the bot screenshare
                  default: false
              additionalProperties: false
        required: true

aid: recall-ai

name: Recall.ai

description: 'Recall.ai provides meeting bot infrastructure through a REST API that enables developers to programmatically join Zoom, Microsoft
  Teams, Google Meet, Webex, Slack Huddles, and other video conferencing platforms. The API delivers real-time and asynchronous access to meeting
  recordings, AI-powered transcription, participant metadata, and structured meeting data. Developers can deploy bots that stream audio and video,
  trigger calendar-driven automations, and extract actionable insights from meetings at scale. Recall.ai supports multi-region deployments across
  US West, US East, EU, and Asia-Pacific, with per-second usage billing and no monthly platform fee.

  '

